<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Apply the saved palette and text size before styles paint; storage may be disabled. -->
		<script>
			try {
				const root = document.documentElement;
				root.dataset.theme = localStorage.getItem('watch-tail:theme') || 'midnight';
				root.dataset.textSize = localStorage.getItem('watch-tail:text-size') || 'default';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
