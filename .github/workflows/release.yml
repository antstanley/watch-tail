name: Release

# Changesets (https://github.com/changesets/changesets) drive this end to end.
#
#   push to main with pending changesets  ->  the Version PR is created/updated
#                                             (see version-pr.yml)
#   merge the Version PR                  ->  this workflow stages that version
#
# Staging means the tarball lands in npm's staging area and is NOT live until a
# human approves it (`npm stage approve`, or the npmjs staged-packages UI). The
# trusted publisher is therefore restricted to stage-publish only, and no npm
# token exists anywhere: authentication is GitHub OIDC, and only the publish job
# can mint one.
#
# One-time setup lives in RELEASING.md.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    name: Read the changesets publish plan
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read the plan
        id: plan
        run: |
          set -euo pipefail
          # `changeset publish-plan` is the official "what is ready to publish or
          # tag?" answer; scripts/release-plan.ts adds the registry and 0.0.0
          # guards and writes the workflow outputs.
          pnpm exec changeset publish-plan --output "${RUNNER_TEMP}/plan.json"
          node scripts/release-plan.ts --plan "${RUNNER_TEMP}/plan.json"
  verify:
    name: Verify the released commit
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm exec oxfmt --check .
      - run: pnpm knip
      # Size budget, no maps or .gz/.br copies, and only declared runtime imports.
      - run: pnpm check:package
      # Metadata is validated before the publish job, which never builds or
      # tests: publishing runs nobody's code, and nobody's code runs with the
      # OIDC token.
      - name: Validate package metadata (publint)
        run: pnpm exec publint

  publish:
    name: Stage to npm
    needs: [plan, verify]
    # `NPM_PUBLISH_ENABLED` is a repository variable (Settings → Secrets and
    # variables → Actions → Variables) that is set to `true` once the npm trusted
    # publisher for this workflow exists. Until then the workflow verifies the
    # release commit and stops here instead of failing on an npm call it is not
    # yet allowed to make. See RELEASING.md.
    if: needs.plan.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for the `npm stage` command
        # Node 24's bundled npm does OIDC trusted publishing but predates staged
        # publishing.
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack from the changesets plan
        # `changeset pack` reads the same plan and runs each package's `prepack`
        # (which builds the app and the CLI into the tarball).
        run: |
          set -euo pipefail
          pnpm exec changeset publish-plan --output "${RUNNER_TEMP}/plan.json"
          pnpm exec changeset pack --from-publish-plan "${RUNNER_TEMP}/plan.json" \
            --out-dir "${RUNNER_TEMP}/packed"
          find "${RUNNER_TEMP}/packed" -name '*.tgz' -print
      - name: Stage
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Auth is GitHub OIDC trusted publishing (id-token: write plus
          # registry-url); --provenance attests the build to this commit.
          STATUS=0
          for tarball in $(find "${RUNNER_TEMP}/packed" -name '*.tgz'); do
            echo "Staging ${tarball}"
            npm stage publish --provenance --access public --ignore-scripts \
              --tag "${DIST_TAG}" "${tarball}" 2>&1 | tee -a "${RUNNER_TEMP}/staged.log" || STATUS=$?
          done
          if [ "${STATUS}" -ne 0 ]; then
            # A version that is already staged (or already published) is not a
            # failure: the release is waiting for its approval, or a human beat
            # us to it. Anything else fails the run.
            if grep -qiE 'already staged|already exists|already published|409' "${RUNNER_TEMP}/staged.log"; then
              echo "::notice::this version is already staged or published; nothing to do"
              exit 0
            fi
            exit "${STATUS}"
          fi
      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "## Staged package"
            echo
            grep 'staged with id' "${RUNNER_TEMP}/staged.log" || echo "No staging id reported."
            echo
            echo 'Not live yet: approve with `npm stage approve` or the npmjs staged-packages UI.'
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure git
        # Creating a tag needs an identity. Without one, `changeset git-tag`
        # swallows the failure and the following push finds no ref, which is
        # exactly how the first release run failed.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `changeset git-tag` writes the canonical tag for the current version
          # (v0.2.0 for a single package), so the tag always matches what was
          # staged.
          pnpm exec changeset git-tag

          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "changeset git-tag did not create v${VERSION}; creating it directly"
            git tag --annotate "v${VERSION}" --message "watch-tail ${VERSION}"
          fi

          if [ -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            git push origin "refs/tags/v${VERSION}"
          else
            echo "v${VERSION} is already on the remote"
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes \
              --notes "Staged to npm by the release workflow. Approve the staged package to make it live:
          https://www.npmjs.com/settings/~/staged-packages"
          fi
