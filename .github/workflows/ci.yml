name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Types, tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      # `.npmrc` sets ignore-scripts=true, so no install hook runs here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm exec oxfmt --check .
      - run: pnpm knip
      # Size budget, no maps or .gz/.br copies, and only declared runtime imports.
      - run: pnpm check:package

  integration:
    name: floci integration + CLI
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        # No health check on purpose: the image ships no curl, wget or nc, so a
        # `--health-cmd` cannot run inside it (it exits 127) and the container
        # never reports healthy. The job waits for the emulator on its own below.
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The service has no health check, so wait for the emulator itself.
      - run: npx --yes wait-on http://localhost:4566/ --timeout 120000
      # The fixtures the integration suite scans for.
      - run: node scripts/seed-floci.ts
      - run: pnpm test:e2e
      - run: pnpm test:cli

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        # No health check on purpose: the image ships no curl, wget or nc, so a
        # `--health-cmd` cannot run inside it (it exits 127) and the container
        # never reports healthy. The job waits for the emulator on its own below.
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The service has no health check, so wait for the emulator itself.
      - run: npx --yes wait-on http://localhost:4566/ --timeout 120000
      - run: node scripts/seed-floci.ts
      # Playwright's own Chromium: the CLI defaults to Google Chrome, which CI
      # does not have, so the smoke run asks for `chromium` explicitly.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the app, then smoke it
        # The server has to live in the same step as the checks: a background
        # process from an earlier step is killed when that step ends.
        run: |
          pnpm dev --port 5173 --strictPort > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          npx --yes wait-on http://localhost:5173/api/health --timeout 60000
          STATUS=0
          node scripts/ui-smoke.ts --url http://localhost:5173 --region us-east-1 \
            --group /aws/lambda/checkout-api --channel chromium || STATUS=$?
          kill "${DEV_PID}" 2>/dev/null || true
          exit "${STATUS}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: dev-server-log
          path: /tmp/dev.log
